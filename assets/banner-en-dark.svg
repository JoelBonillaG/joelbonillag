  <title id="t">Joel Bonilla — Full stack developer</title>
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    .r2 { animation-delay: .25s; }
    .r3 { animation-delay: .45s; }
    .line { animation: draw 1.2s .6s cubic-bezier(.2,.7,.2,1) both; transform-origin: left; transform-box: fill-box; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(1.6); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
